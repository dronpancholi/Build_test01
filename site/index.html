  <style>
    /* ── BuildIT branding overrides ── */
    :root { --buildit-yellow: #FFD400; }

    /* Footer credit bar */
    #buildit-footer-credit {
      width: 100%;
      text-align: center;
      padding: 20px 20px 24px;
      font-size: 13px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0.04em;
      background: #0a0a0a;
      color: rgba(255,255,255,0.55);
      border-top: 1px solid rgba(255,255,255,0.08);
      position: relative;
      z-index: 9999;
    }
    #buildit-footer-credit strong {
      color: rgba(255,255,255,0.85);
      font-weight: 600;
    }
    #buildit-footer-credit .it-yellow {
      color: #FFD400;
      font-weight: 700;
    }
  </style>

  <script>
    (function() {
      // ── 1. Wrap "IT" in BuildIT with yellow ───────────────────────────────
      function wrapIT(node) {
        if (node.nodeType === 3) {
          var txt = node.nodeValue;
          if (/BuildIT/i.test(txt)) {
            var span = document.createElement('span');
            span.innerHTML = txt.replace(/Build(IT)/gi,
              'Build<span style="color:#FFD400;font-weight:inherit">IT</span>');
            if (node.parentNode) node.parentNode.replaceChild(span, node);
          }
        } else if (node.nodeType === 1 && node.tagName &&
                   !['SCRIPT','STYLE','NOSCRIPT','TEXTAREA','INPUT'].includes(node.tagName)) {
          Array.from(node.childNodes).forEach(wrapIT);
        }
      }

      // ── 2. Replace any remaining "monopo" text visually ──────────────────
      function replaceMonopo(node) {
        if (node.nodeType === 3) {
          var txt = node.nodeValue;
          if (/monopo/i.test(txt)) {
            node.nodeValue = txt
              .replace(/monopo[\s\-]?saigon/gi, 'BuildIT')
              .replace(/monopo/gi, 'BuildIT');
            if (node.parentNode) wrapIT(node.parentNode);
          }
        } else if (node.nodeType === 1 && node.tagName &&
                   !['SCRIPT','STYLE','NOSCRIPT','TEXTAREA','INPUT'].includes(node.tagName)) {
          Array.from(node.childNodes).forEach(replaceMonopo);
        }
      }

      // ── 3. Inject footer credit bar ───────────────────────────────────────
      function injectFooterCredit() {
        if (document.getElementById('buildit-footer-credit')) return;
        var bar = document.createElement('div');
        bar.id = 'buildit-footer-credit';
        bar.innerHTML =
          'Made by <strong>Dron Pancholi</strong>' +
          ' &nbsp;&bull;&nbsp; ' +
          'Crafted by Build<span class="it-yellow">IT</span> in <strong>Ahmedabad, Gujarat</strong>';
        document.body.appendChild(bar);
      }

      // ── 4. Run all patches ────────────────────────────────────────────────
      var observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(m) {
          m.addedNodes.forEach(function(node) {
            replaceMonopo(node);
            wrapIT(node);
          });
        });
      });

      document.addEventListener('DOMContentLoaded', function() {
        observer.observe(document.body, { childList: true, subtree: true });
        replaceMonopo(document.body);
        wrapIT(document.body);
        injectFooterCredit();
        // Pass after first Nuxt render
        setTimeout(function() {
          replaceMonopo(document.body);
          wrapIT(document.body);
        }, 800);
        // Pass after full hydration
        setTimeout(function() {
          replaceMonopo(document.body);
          wrapIT(document.body);
        }, 2500);
        // Final pass
        setTimeout(function() {
          replaceMonopo(document.body);
          wrapIT(document.body);
        }, 5000);
      });
    })();
  </script>
